name: Auto Fetch TG Events

on:
  schedule:
    - cron: '0 4 * * *' # Uruchamiaj codziennie o 4:00 AM UTC
  workflow_dispatch: # Pozwala też uruchomić ręcznie z panelu GitHub

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper & Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/parse_post.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "TG Events Bot"
          git config --global user.email "bot@tgevents.pl"
          git add data/events.json
          git commit -m "auto: update events database [skip ci]" || exit 0
          git push