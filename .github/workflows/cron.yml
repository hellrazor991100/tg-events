name: Auto Fetch TG Events

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  fetch-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run post parser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -f scripts/parse_post.js ]; then
            node scripts/parse_post.js
          else
            node tg-events/scripts/parse_post.js
          fi

      - name: Commit and push updated events
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Dodaje wszystkie zmienione pliki (czyli nasz events.json)
          git add .
          
          if git diff --staged --quiet; then
            echo "Brak nowych zmian w wydarzeniach."
          else
            git commit -m "chore: auto-update events [skip ci]"
            git push
          fi
